<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Theme options — Backwash Records</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html { background: #1b1b1b; }
  body {
    margin: 0;
    min-height: 100vh;
    background: #1b1b1b;
    color: #eee;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    line-height: 1.4;
  }

  .top {
    max-width: 1100px;
    margin: 0 auto;
    padding: 32px 16px 8px;
    text-align: center;
  }
  h1 { margin: 0 0 8px; font-size: 1.75rem; font-weight: 700; }
  .top p { margin: 0 auto 12px; max-width: 48ch; color: #bbb; }
  .top a { color: #eee; }

  .controls {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
    gap: 12px 20px;
    padding: 16px;
  }
  .seg {
    display: inline-flex;
    padding: 3px;
    border: 1px solid #444;
    border-radius: 999px;
    background: #141414;
  }
  .seg button {
    font: inherit;
    font-size: .95rem;
    color: #bbb;
    background: transparent;
    border: 0;
    border-radius: 999px;
    padding: 8px 16px;
    cursor: pointer;
  }
  .seg button[aria-pressed="true"] { background: #eee; color: #1b1b1b; }

  .slug {
    display: flex;
    align-items: center;
    gap: 8px;
    color: #bbb;
    font-size: .95rem;
  }
  .slug input {
    font: inherit;
    font-size: 1rem;
    color: #eee;
    background: #141414;
    border: 1px solid #444;
    border-radius: 10px;
    padding: 8px 12px;
    width: 180px;
  }

  button:focus-visible,
  input:focus-visible,
  a:focus-visible {
    outline: 2px solid #8ab4ff;
    outline-offset: 2px;
  }

  .grid {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 28px;
    max-width: 1200px;
    margin: 0 auto;
    padding: 16px 16px 48px;
  }
  .card {
    margin: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    max-width: 100%;
  }
  .card figcaption {
    max-width: 281px;
    font-size: .9rem;
    color: #bbb;
    text-align: center;
  }
  .frame {
    position: relative;
    width: 281px;
    height: 562px;
    overflow: hidden;
    border-radius: 28px;
    background: #000;
    transform: translateZ(0);
  }
  .frame::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    border: 1px solid #3a3a3a;
    pointer-events: none;
  }
  .frame iframe {
    display: block;
    width: 390px;
    height: 780px;
    border: 0;
    transform: scale(.72);
    transform-origin: top left;
  }
  .open {
    font-size: .9rem;
    color: #8ab4ff;
  }
</style>
</head>
<body>
  <header class="top">
    <h1>Pick a design</h1>
    <p>Each frame is the real page. Try them on your phone with the round "Change design" button on any page (when it is turned on). To set the default design, open Admin → Site settings → Default design. To make everyone see it, lock it there.</p>
    <p><a href="admin/">Open admin</a></p>
  </header>

  <section class="controls" aria-label="Preview options">
    <div class="seg" role="group" aria-label="Page type">
      <button type="button" data-mode="album" aria-pressed="true">Album page</button>
      <button type="button" data-mode="store" aria-pressed="false">Store page</button>
    </div>
    <label class="slug">
      <span>Album slug</span>
      <input id="slug" type="text" value="demo" autocomplete="off" autocapitalize="none" spellcheck="false">
    </label>
  </section>

  <main class="grid" id="grid"></main>

  <script type="module">
    import { THEMES, SLUG_RE } from './assets/js/platforms.js';

    const state = { mode: 'album', slug: 'demo' };
    const grid = document.getElementById('grid');
    const slugInput = document.getElementById('slug');
    const modeButtons = [...document.querySelectorAll('button[data-mode]')];

    function pageUrl(themeKey) {
      const params = new URLSearchParams();
      if (state.mode === 'album') params.set('a', state.slug);
      params.set('theme', themeKey);
      return `index.html?${params}`;
    }

    const cards = THEMES.map((theme) => {
      const figure = document.createElement('figure');
      figure.className = 'card';

      const caption = document.createElement('figcaption');
      caption.textContent = theme.label;

      const frame = document.createElement('div');
      frame.className = 'frame';

      const iframe = document.createElement('iframe');
      iframe.loading = 'lazy';
      iframe.title = `${theme.label} preview`;
      frame.append(iframe);

      const open = document.createElement('a');
      open.className = 'open';
      open.target = '_blank';
      open.rel = 'noopener';
      open.textContent = 'Open full size ↗';

      figure.append(caption, frame, open);
      grid.append(figure);
      return { theme, iframe, open };
    });

    function update() {
      for (const { theme, iframe, open } of cards) {
        const url = pageUrl(theme.key);
        if (iframe.getAttribute('src') !== url) iframe.src = url;
        open.href = url;
      }
    }

    for (const btn of modeButtons) {
      btn.addEventListener('click', () => {
        state.mode = btn.dataset.mode;
        for (const b of modeButtons) b.setAttribute('aria-pressed', String(b === btn));
        update();
      });
    }

    let slugTimer = 0;
    slugInput.addEventListener('input', () => {
      clearTimeout(slugTimer);
      slugTimer = setTimeout(() => {
        const value = slugInput.value.trim();
        if (!SLUG_RE.test(value) || value === state.slug) return;
        state.slug = value;
        update();
      }, 400);
    });

    update();
  </script>
</body>
</html>
