# Copies the main branch to GitLab after every push to main.
# GitLab then publishes the site with GitLab Pages (see .gitlab-ci.yml).
#
# Needs two repository secrets (GitHub → Settings → Secrets and variables → Actions):
#   GITLAB_PROJECT  path of the GitLab project, e.g. "your-gitlab-username/backwash-link-generator"
#                   (its full web address is accepted too)
#   GITLAB_TOKEN    GitLab personal access token that can push to that project
#                   (fine-grained: Code → Push and Download; classic: write_repository scope)
# Optional secret GITLAB_HOST for a self-hosted GitLab (default: gitlab.com).
#
# Run it by hand with "Only check" ticked to test the secrets without changing anything on GitLab.
name: Mirror to GitLab

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      check_only:
        description: Only check the secrets and access (push nothing)
        type: boolean
        default: false

concurrency:
  group: mirror-to-gitlab-${{ github.ref }}
  cancel-in-progress: true # a newer push already contains the older commits

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check the GitLab secrets and access
        id: check
        env:
          GITLAB_PROJECT: ${{ secrets.GITLAB_PROJECT }}
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          GITLAB_HOST: ${{ secrets.GITLAB_HOST }}
        run: |
          fail() { echo "::error::$1"; exit 1; }
          [ -n "$GITLAB_PROJECT" ] || fail "The GITLAB_PROJECT secret is missing (README, Step 1)."
          [ -n "$GITLAB_TOKEN" ] || fail "The GITLAB_TOKEN secret is missing (README, Step 1)."

          host="${GITLAB_HOST:-gitlab.com}"
          project="$(printf '%s' "$GITLAB_PROJECT" | tr -d '[:space:]')"
          # A pasted web address works too: keep only the path after the host.
          case "$project" in
            *://*) project="${project#*://}"; project="${project#*/}"; echo "GITLAB_PROJECT is a web address; using only its path." ;;
            "$host"/*) project="${project#"$host"/}" ;;
          esac
          project="${project%%/-/*}"; project="${project%%\?*}"; project="${project%%#*}" # drop /-/tree/main, ?query, #anchor
          project="${project#/}"; project="${project%/}"; project="${project%.git}"
          echo "$project" | grep -Eq '^[A-Za-z0-9_.-]+(/[A-Za-z0-9_.-]+)+$' \
            || fail "GITLAB_PROJECT does not look like a project path (owner/project)."
          echo "Project path: $(echo "$project" | tr -c '/\n' 'x') (letters hidden; $(echo "$project" | tr -cd '/' | wc -c) slash)"

          # What GitLab says about the token itself (works for most token types; the token value is never printed).
          api="https://${host}/api/v4"
          info="$(curl -sS -H "PRIVATE-TOKEN: ${GITLAB_TOKEN}" "${api}/personal_access_tokens/self" || true)"
          if echo "$info" | jq -e '.id' >/dev/null 2>&1; then
            echo "Token: $(echo "$info" | jq -c '{name, active, revoked, expires_at, scopes, last_used_at}')"
            [ "$(echo "$info" | jq -r '.active')" = "true" ] || fail "This GitLab token is revoked or expired. Make a new one (README, Step 1, item 3)."
          else
            echo "GitLab did not describe the token (normal for some token types): $(echo "$info" | head -c 200)"
          fi

          url="https://oauth2:${GITLAB_TOKEN}@${host}/${project}.git"
          # Only the host and path go to the next step; it adds the token from the secret itself.
          echo "host=$host" >> "$GITHUB_OUTPUT"
          echo "project=$project" >> "$GITHUB_OUTPUT"

          explain() { # $1 = git output
            case "$1" in
              *"error: 401"*|*"Access denied"*|*"Authentication failed"*)
                echo "GitLab rejected the token: it is wrong, expired or revoked. Make a new one and update the GITLAB_TOKEN secret." ;;
              *"error: 404"*|*"not found"*|*"could not be found"*)
                echo "GitLab cannot find the project with this token: check the GITLAB_PROJECT path, and that a fine-grained token's access includes this project." ;;
              *"error: 403"*)
                echo "GitLab knows the token but does not allow this. Fine-grained token: give it Code → Download and Code → Push on this project (or make a classic token with the write_repository scope). Also check that your GitLab account is verified." ;;
              *) echo "Unexpected error from GitLab (see above)." ;;
            esac
          }

          echo "--- Can the token read the project?"
          if out="$(git ls-remote "$url" 2>&1)"; then
            echo "Yes. Branches on GitLab: $(echo "$out" | grep -c 'refs/heads/' || true)"
          else
            echo "$out"; fail "Read check failed. $(explain "$out")"
          fi

          echo "--- Can the token push to main? (trial run, nothing is written)"
          if out="$(git push --dry-run "$url" HEAD:refs/heads/main 2>&1)"; then
            echo "Yes."
          else
            echo "$out"
            fail "Push check failed. $(explain "$out")"
          fi

      - name: Push main to GitLab
        if: ${{ !inputs.check_only }}
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          HOST: ${{ steps.check.outputs.host }}
          PROJECT: ${{ steps.check.outputs.project }}
        run: |
          if out="$(git push "https://oauth2:${GITLAB_TOKEN}@${HOST}/${PROJECT}.git" HEAD:refs/heads/main 2>&1)"; then
            echo "$out"; exit 0
          fi
          echo "$out"
          case "$out" in
            *"protected branch"*|*"not allowed to push"*)
              echo "::error::GitLab refuses pushes to main. In GitLab: Settings → Repository → Protected branches → main → Allowed to push and merge: Maintainers, and make sure your account is a Maintainer or Owner of the project." ;;
            *"non-fast-forward"*|*"fetch first"*)
              echo "::error::GitLab's main already has other commits (for example a README made with the project). Delete and recreate the GitLab project empty (README, Step 1, item 2)." ;;
            *) echo "::error::The push to GitLab failed (see above)." ;;
          esac
          exit 1
